version: 2
sources:
    - name: datafeed_shared_schema
      database: "{{('sales')}}"
      schema: raw_schema
      tables:
        - name: RAW_CUSTOMER
        - name: emp_sal
        - name: raw_order
          columns:
            - name: id
              tests:
               - unique
               - not_null
            - name: status
              tests:
               - accepted_values:
                      values: ['placed', 'shipped', 'completed', 'returned', 'return_pending']
        - name: customers
        